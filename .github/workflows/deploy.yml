name: Deploy site

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**.scss"
      - "**.rb"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**.scss"
      - "**.rb"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: "Send every page in the sitemap to IndexNow, not only new and changed ones"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  deploy:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip" # caching pip dependencies
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          propertyPath: "giscus.repo"
          value: ${{ github.repository }}
      - name: Install ImageMagick 🖼️
        # ubuntu-24.04 runners no longer ship ImageMagick; without it jekyll-imagemagick
        # silently skips generating the responsive *.webp images referenced by <picture>.
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert -version
      - name: Save the live sitemap 🗺️
        # bin/indexnow.py compares it with the new one to find the pages this deploy adds
        if: github.event_name != 'pull_request'
        run: |
          url=$(sed -n 's/^url: *\([^ #]*\).*/\1/p' _config.yml)
          curl -sfL "$url/sitemap.xml" -o "$RUNNER_TEMP/live-sitemap.xml" || echo "no live sitemap"
      - name: Install and Build 🔧
        run: |
          pip3 install --upgrade nbconvert
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
      - name: Tell search engines about new pages 🔔
        # IndexNow passes the addresses to Bing, Yandex and the other engines that share it; a failure here
        # must not fail the deploy
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          : > "$RUNNER_TEMP/changed.txt"
          if [ "${{ github.event_name }}" = push ] && git fetch -q --depth=1 origin "$BEFORE"; then
            git diff --name-only "$BEFORE" HEAD > "$RUNNER_TEMP/changed.txt"
          fi
          python3 bin/indexnow.py --old "$RUNNER_TEMP/live-sitemap.xml" --changed "$RUNNER_TEMP/changed.txt" \
            ${{ inputs.indexnow_all && '--all' || '' }}
